<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morning Brief</title>
<meta name="description" content="Your weekday morning brief.">
<meta name="theme-color" content="#f8f2e6" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brief">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
<script>
// Light is the default. Apply a saved choice before the page paints.
try { var t = localStorage.getItem("brief-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<div class="appbar">
  <div class="appbar-in">
    <span class="appname">Morning Brief</span>
    <button class="navbtn" id="prev" aria-label="Previous brief" disabled>‹</button>
    <button class="datebtn" id="dateBtn" aria-haspopup="dialog" aria-label="Open archive"><span id="dateTxt">—</span> ▾</button>
    <button class="navbtn" id="next" aria-label="Next brief" disabled>›</button>
    <button class="navbtn refreshbtn" id="refreshBtn" aria-label="Check for a new brief">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="navbtn themebtn" id="themeBtn" aria-label="Switch between light and dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>

<div class="wrap">
  <header>
    <span class="label" id="eyebrow">Weekday brief</span>
    <h1 id="dayTitle">Your briefs</h1>
    <p class="sub" id="sub">Loading your briefs…</p>
    <span class="offline" id="offline" hidden>Offline · saved copy</span>
  </header>
  <div id="brief">
    <div class="state"><strong>Loading…</strong><span>Each weekday's brief is saved here, so you can swipe back through earlier mornings.</span></div>
  </div>
  <footer>A new brief arrives each weekday morning. Swipe or use ‹ › to move between days.</footer>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="archTitle" hidden>
  <div class="sheet-in">
    <div class="sheet-head"><h2 id="archTitle">All briefs</h2><button class="navbtn" id="closeSheet" aria-label="Close archive">✕</button></div>
    <div id="archList"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
